<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yixi tang</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #000;
    cursor: none; /* 隐藏默认光标，用发光小球代替 */
  }

  /* 白色发光文字 */
  .text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(40px, 9vw, 110px);
    font-weight: 700;
    letter-spacing: 5px;
    color: #fff;
    text-shadow:
      0 0 10px rgba(255, 255, 255, 0.95),
      0 0 22px rgba(255, 255, 255, 0.75),
      0 0 44px rgba(255, 255, 255, 0.5),
      0 0 88px rgba(255, 255, 255, 0.35);
    user-select: none;
    white-space: nowrap;
    pointer-events: none;
  }

  /* 白色发光小球 */
  .ball {
    position: fixed;
    top: 0;
    left: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #e8f2ff 55%, rgba(200, 225, 255, 0.6));
    box-shadow:
      0 0 12px rgba(255, 255, 255, 0.95),
      0 0 30px rgba(255, 255, 255, 0.6),
      0 0 60px rgba(255, 255, 255, 0.4),
      0 0 100px rgba(255, 255, 255, 0.25);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="ball" id="ball"></div>
  <div class="text">yixi tang</div>

  <script>
    (function () {
      var ball = document.getElementById('ball');
      var targetX = window.innerWidth / 2;
      var targetY = window.innerHeight / 2;
      var x = targetX, y = targetY;

      // 桌面：鼠标移动
      window.addEventListener('mousemove', function (e) {
        targetX = e.clientX;
        targetY = e.clientY;
      });
      // 移动端：手指滑动
      window.addEventListener('touchmove', function (e) {
        var t = e.touches[0];
        targetX = t.clientX;
        targetY = t.clientY;
      }, { passive: true });

      // 平滑跟随
      (function loop() {
        x += (targetX - x) * 0.18;
        y += (targetY - y) * 0.18;
        ball.style.left = x + 'px';
        ball.style.top = y + 'px';
        requestAnimationFrame(loop);
      })();
    })();
  </script>
</body>
</html>
